[project]
name = "voicenote"
version = "0.1.0"
description = "Voicenote — multilingual transcription service (Voxtral + Whisper)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "sherpa-onnx>=1.10",
]

[project.scripts]
voicenote-server = "voicenote.main:run"
voicenote-seed = "voicenote.scripts.seed_user:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicenote"]
