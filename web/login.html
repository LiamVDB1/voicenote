<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EDE0">
  <title>voicenote — inloggen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="auth-shell">
    <form class="auth-card" id="login-form" autocomplete="on">
      <a class="wordmark" href="/" aria-label="voicenote">
        <span class="wordmark-icon" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="wordmark-text"><i>voice</i>note</span>
      </a>
      <h1 class="auth-title">Welkom terug</h1>
      <p class="auth-sub">Log in om je transcripten te zien.</p>

      <div class="auth-error" id="auth-error" hidden></div>

      <div class="auth-field">
        <label for="username">Gebruikersnaam</label>
        <input type="text" id="username" name="username" autocomplete="username"
               required autocapitalize="none" spellcheck="false">
      </div>

      <div class="auth-field">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="submit" id="submit-btn">
        <span class="submit-label">Inloggen</span>
        <span class="submit-arrow" aria-hidden="true">→</span>
      </button>
    </form>
  </main>

  <script>
    (() => {
      const form = document.getElementById('login-form');
      const errBox = document.getElementById('auth-error');
      const btn = document.getElementById('submit-btn');
      const u = document.getElementById('username');
      const p = document.getElementById('password');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        const orig = btn.querySelector('.submit-label').textContent;
        btn.querySelector('.submit-label').textContent = 'Even kijken…';

        try {
          const r = await fetch('/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username: u.value.trim(), password: p.value })
          });
          if (r.ok) {
            window.location.replace('/');
            return;
          }
          let msg = 'Gebruikersnaam of wachtwoord klopt niet.';
          try {
            const j = await r.json();
            if (j?.detail) msg = j.detail;
          } catch (_) {}
          errBox.textContent = msg;
          errBox.hidden = false;
        } catch (err) {
          errBox.textContent = 'Kan de server niet bereiken.';
          errBox.hidden = false;
        } finally {
          btn.disabled = false;
          btn.querySelector('.submit-label').textContent = orig;
        }
      });
    })();
  </script>
</body>
</html>
